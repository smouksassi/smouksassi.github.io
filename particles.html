<!-- particles.html -->
<div id="particles-js"></div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  particlesJS("particles-js", {
    particles: {
      number: { value: 45 },
      color: { value: "#2c3e50" },
      shape: { type: "circle" },
      opacity: { value: 0.45 },
      size: {
        value: 6,         /* larger particles */
        random: true
      },
      line_linked: {
        enable: true,
        distance: 180,
        color: "#2c3e50",
        opacity: 0.18,
        width: 1
      },
      move: {
        enable: true,
        speed: 0.7,
        direction: "none",
        straight: false,
        out_mode: "out"
      }
    },
    interactivity: {
      detect_on: "window",
      events: {
        onhover: {
          enable: true,
          mode: "repulse"
        },
        onclick: {
          enable: true,
          mode: "push"
        }
      },
      modes: {
        repulse: {
          distance: 120,
          duration: 0.4
        },
        push: {
          particles_nb: 3
        }
      }
    },
    retina_detect: true
  });
});
</script>
